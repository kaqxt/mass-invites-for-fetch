name: Run Fetch Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: accounts-and-receipts
          path: |
            accounts.jsonl
            receipts/